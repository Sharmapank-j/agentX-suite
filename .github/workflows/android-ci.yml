name: AgentX Suite CI

concurrency:
  group: agentx-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify AgentX Suite (3 Applications)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew
      - name: Run Unit Tests (All 3 Modules)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Build Debug APKs (All 3 Applications)
        if: always()
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            medical/build/reports/tests/testDebugUnitTest/
            admin/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload Debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentx-suite-debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            medical/build/outputs/apk/debug/medical-debug.apk
            admin/build/outputs/apk/debug/admin-debug.apk

  publish-release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: agentx-suite-debug-apks
          path: dist
      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release
          cp dist/app/build/outputs/apk/debug/app-debug.apk release/AgentX-${VERSION}-debug.apk
          cp dist/medical/build/outputs/apk/debug/medical-debug.apk release/AgentX-Medical-${VERSION}-debug.apk
          cp dist/admin/build/outputs/apk/debug/admin-debug.apk release/AgentX-Serve-${VERSION}-debug.apk
          cd release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release and upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: AgentX Suite ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          body: |
            ## AgentX Suite v1.0.0 — Major Release

            ### Included Applications:
            - **AgentX** — Autonomous on-device AI assistant with Multimodal Local Vision Engine, Gemini 3.8 Flash & Local GGUF (`llama.cpp`) native inference, Dynamic Multi-Model Hub, WebRTC P2P DataChannel, and tactile Haptics.
            - **AgentX Medical** — Clinical triaging, offline drug-interaction intelligence, bedside telemetry, and localized reasoning.
            - **AgentX Serve** — On-device OpenAI-compatible HTTP/SSE edge gateway hub with In-App Reverse Tunneling, 6-Digit Cloud Rendezvous, and Multimodal Vision Projector Serving.

            ### What's New in v1.0.0:
            - **Local Multi-Model Dynamic Hub**:
              - In-app discovery and switching across multiple local `.gguf` models stored on device (`/sdcard/Download`, internal storage, SD cards).
              - Safe model hot-swapping with complete memory deallocation and clean context reloading.
            - **Multimodal Local Vision Engine**:
              - Offline image comprehension directly on mobile using `mtmd` & `llama-clip` multimodal projector weights (`mmproj-*.gguf`) alongside language weights.
              - Auto-detection and pairing of projector files in model directories with image prompt integration.
            - **Production WebRTC P2P Direct DataChannel**:
              - Automated STUN candidate exchange during 6-digit cloud rendezvous pairing.
              - Zero-relay, direct UDP token streaming between devices with graceful HTTP/SSE failover.
            - **On-Device Benchmark & Hardware Profiler**:
              - Real-time metrics in chat: Time-To-First-Token (TTFT), tokens/sec throughput, active RAM footprint, and thermal status.
              - In-app hardware benchmark suite measuring prompt evaluation and token generation speed on mobile SoCs.
