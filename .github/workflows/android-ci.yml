name: AgentX Suite CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify AgentX Suite (3 Applications)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests (All 3 Modules)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APKs (All 3 Applications)
        if: always()
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            medical/build/reports/tests/testDebugUnitTest/
            admin/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload Debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentx-suite-debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            medical/build/outputs/apk/debug/medical-debug.apk
            admin/build/outputs/apk/debug/admin-debug.apk
