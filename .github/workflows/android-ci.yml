name: AgentX Suite CI

concurrency:
  group: agentx-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify AgentX Suite (3 Applications)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew
      - name: Run Unit Tests (All 3 Modules)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Build Debug APKs (All 3 Applications)
        if: always()
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            medical/build/reports/tests/testDebugUnitTest/
            admin/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload Debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentx-suite-debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            medical/build/outputs/apk/debug/medical-debug.apk
            admin/build/outputs/apk/debug/admin-debug.apk

  publish-release:
    name: Publish GitHub Release
    needs: build-and-test
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: agentx-suite-debug-apks
          path: dist
      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-v1.3.0}"
          if [[ "$VERSION" == "main" || "$VERSION" == "master" ]]; then
            VERSION="v1.3.0"
          fi
          mkdir -p release
          cp dist/app/build/outputs/apk/debug/app-debug.apk release/AgentX-${VERSION}-debug.apk
          cp dist/medical/build/outputs/apk/debug/medical-debug.apk release/AgentX-Medical-${VERSION}-debug.apk
          cp dist/admin/build/outputs/apk/debug/admin-debug.apk release/AgentX-Serve-${VERSION}-debug.apk
          cd release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release and upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.3.0' }}
          target_commitish: ${{ github.sha }}
          name: AgentX Suite ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.3.0' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          body: |
            ## AgentX Suite Release

            ### Included
            - **AgentX** — General autonomous AI assistant with Multimodal Vision, Gemini 3.8 Flash & Local GGUF (llama.cpp) inference, and tactile Haptic Feedback.
            - **AgentX Medical** — Clinical education, offline drug-interaction intelligence, and bedside telemetry.
            - **AgentX Serve** — On-device OpenAI-compatible HTTP serving engine for edge computing.

            ### Key Capabilities:
            - **Multimodal Vision Input**: Photo Library picker and direct Camera capture with downsampled memory safety and Base64 vision payload delivery.
            - **Inference & Provider Switcher Hub**: Seamlessly toggle between Local GGUF, Google Gemini Multimodal (`gemini-3.8-flash`), Hybrid Auto-Failover, and LAN Server Gateway.
            - **Tactile Haptic Feedback**: Dynamic linear motor tactile response across streaming tokens, button taps, attachments, and model activations with a dedicated Settings toggle (ON/OFF).
