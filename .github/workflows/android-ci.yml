name: AgentX Suite CI

concurrency:
  group: agentx-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify AgentX Suite (3 Applications)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew
      - name: Run Unit Tests (All 3 Modules)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Build Release APKs (All 3 Applications)
        run: ./gradlew assembleRelease --no-daemon
      - name: Publish Core Package to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :core:publishReleasePublicationToGitHubPackagesRepository --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            medical/build/reports/tests/testDebugUnitTest/
            admin/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: agentx-suite-release-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            medical/build/outputs/apk/release/medical-release.apk
            admin/build/outputs/apk/release/admin-release.apk

  publish-release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: agentx-suite-release-apks
          path: dist
      - name: Prepare release assets and extract changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release
          cp dist/app/build/outputs/apk/release/app-release.apk release/AgentX-${VERSION}.apk
          cp dist/medical/build/outputs/apk/release/medical-release.apk release/AgentX-Medical-${VERSION}.apk
          cp dist/admin/build/outputs/apk/release/admin-release.apk release/AgentX-Serve-${VERSION}.apk
          cd release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          python3 scripts/extract_release_notes.py "${VERSION}"
      - name: Create GitHub Release and upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: AgentX Suite ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.apk
            release/SHA256SUMS.txt
